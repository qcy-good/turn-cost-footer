name: qcy-good/turn-cost-footer
category: usage
description:
  en: 'Adds the real cost of each assistant turn, plus the running total for today, to the completed-turn footer of DeepSeek Harness. Amounts are folded from the session log with a local CNY price table: no billing API, no network call, and no extra tokens.'
  zh: '在 DeepSeek Harness 每条助手回复的页脚、时间之后显示本轮真实花费与今日累计：按会话日志里的用量和本地人民币价目表折算，不调计费接口、不联网、也不额外消耗 token。'
